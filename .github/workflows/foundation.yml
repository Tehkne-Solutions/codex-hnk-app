name: HNK Platform Foundation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.1.0
          run_install: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install workspace
        run: pnpm install --no-frozen-lockfile

      - name: Validate architecture baseline
        run: pnpm validate:architecture

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Report versions
        if: always()
        run: |
          node --version
          pnpm --version

  kether-p0-db:
    name: Kether P0 DB Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Run Kether P0 database acceptance suite
        run: supabase test db supabase/tests/kether_p0.sql

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
