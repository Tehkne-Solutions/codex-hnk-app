name: HNK Day 001 Visual Proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/web/app/day-001/**'
      - 'packages/ui/**'
      - 'packages/audio-contract/**'
      - 'scripts/export-day001-proof.mjs'
      - 'scripts/validate-experience-qa.mjs'
      - 'scripts/validate-audio-contract.mjs'
      - 'docs/experience/HNK_EXPERIENCE_QA_GATE_V1.md'
      - 'docs/audio/**'
      - '.github/workflows/day001-visual-proof.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/app/day-001/**'
      - 'packages/ui/**'
      - 'packages/audio-contract/**'
      - 'scripts/export-day001-proof.mjs'
      - 'scripts/validate-experience-qa.mjs'
      - 'scripts/validate-audio-contract.mjs'
      - 'docs/experience/HNK_EXPERIENCE_QA_GATE_V1.md'
      - 'docs/audio/**'
      - '.github/workflows/day001-visual-proof.yml'

permissions:
  contents: read

jobs:
  export-day001-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HNK_DAY001_BASE_URL: http://127.0.0.1:3000
      HNK_DAY001_OUT: artifacts/day001

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.1.0
          run_install: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install workspace
        run: pnpm install --no-frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate Day 001 immersive contract
        run: |
          pnpm validate:ui
          pnpm validate:day001
          pnpm validate:experience
          pnpm validate:audio

      - name: Build web experience
        run: pnpm --filter @hnk/web build

      - name: Start web experience
        run: |
          pnpm --filter @hnk/web exec next start -H 127.0.0.1 -p 3000 > /tmp/hnk-day001-web.log 2>&1 &
          echo $! > /tmp/hnk-day001-web.pid

      - name: Wait for Day 001 route
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent "${HNK_DAY001_BASE_URL}/day-001" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hnk-day001-web.log
          exit 1

      - name: Export six macroacts, Relic Moment and immersive walkthrough
        run: node scripts/export-day001-proof.mjs

      - name: Verify immersive proof artifact
        run: |
          for act in limiar revelacao jachin boaz meio passagem; do
            test -s "$HNK_DAY001_OUT/day001-${act}-desktop.png"
            test -s "$HNK_DAY001_OUT/day001-${act}-mobile-390.png"
          done
          test -s "$HNK_DAY001_OUT/day001-relic-origin-lens-desktop.png"
          test -s "$HNK_DAY001_OUT/day001-relic-origin-lens-mobile-390.png"
          test -s "$HNK_DAY001_OUT/day001-immersive-walkthrough-desktop.webm"
          test -s "$HNK_DAY001_OUT/export-manifest.json"
          grep -q '"experience": "kether-day-001-immersive-v2"' "$HNK_DAY001_OUT/export-manifest.json"
          grep -q '"id": "origin-lens-v1"' "$HNK_DAY001_OUT/export-manifest.json"
          grep -q '"canonicalSigil": false' "$HNK_DAY001_OUT/export-manifest.json"
          grep -q '"audioStatus": "PRESET_PENDING_NO_AUDIO_TRACK_EXPECTED"' "$HNK_DAY001_OUT/export-manifest.json"
          grep -q '"audioContract": "HNK_AUDIO_PRESET_CONTRACT_V1_NO_RITUAL_PRESET_PUBLISHED"' "$HNK_DAY001_OUT/export-manifest.json"
          grep -q '"visualApproval": "REQUIRES_HUMAN_VIDEO_DEVICE_REVIEW"' "$HNK_DAY001_OUT/export-manifest.json"
          for act in limiar revelacao jachin boaz meio passagem; do
            grep -q "\"${act}\"" "$HNK_DAY001_OUT/export-manifest.json"
          done
          cat "$HNK_DAY001_OUT/export-manifest.json"

      - name: Upload Day 001 immersive visual proof
        uses: actions/upload-artifact@v4
        with:
          name: hnk-kether-day001-immersive-v2-proof
          path: artifacts/day001
          if-no-files-found: error
          retention-days: 30

      - name: Stop web experience
        if: always()
        run: |
          if [ -f /tmp/hnk-day001-web.pid ]; then
            kill "$(cat /tmp/hnk-day001-web.pid)" || true
          fi
