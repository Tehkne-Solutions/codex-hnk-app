name: HNK Day 001 Native Android Visual Proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/mobile/src/features/kether/KetherOriginRelicNative.tsx'
      - 'apps/mobile/src/features/kether/Day001ImmersiveMobileVerticalSlice.tsx'
      - 'apps/mobile/src/app/labs/day001-origin-lens.tsx'
      - 'apps/mobile/app.json'
      - 'apps/mobile/package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/run-day001-native-origin-lens-android-proof.sh'
      - 'scripts/validate-experience-qa.mjs'
      - '.github/workflows/day001-native-origin-lens-android-proof.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/src/features/kether/KetherOriginRelicNative.tsx'
      - 'apps/mobile/src/features/kether/Day001ImmersiveMobileVerticalSlice.tsx'
      - 'apps/mobile/src/app/labs/day001-origin-lens.tsx'
      - 'apps/mobile/app.json'
      - 'apps/mobile/package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/run-day001-native-origin-lens-android-proof.sh'
      - 'scripts/validate-experience-qa.mjs'
      - '.github/workflows/day001-native-origin-lens-android-proof.yml'

permissions:
  contents: read

jobs:
  android-origin-lens-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      EXPO_PUBLIC_HNK_NATIVE_VISUAL_PROOF: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.1.0
          run_install: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Install workspace
        run: pnpm install --no-frozen-lockfile

      - name: Validate Day 001 native experience contract
        run: |
          pnpm validate:day001
          pnpm validate:experience
          pnpm --filter @hnk/mobile typecheck

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Render Origin Lens in Android release runtime
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: sh scripts/run-day001-native-origin-lens-android-proof.sh

      - name: Verify Android visual proof artifact
        run: |
          for layer in 1 2 3; do
            test -s "artifacts/day001-native-origin-lens-android/layer-${layer}-motion.png"
            test -s "artifacts/day001-native-origin-lens-android/layer-${layer}-motion.xml"
          done
          test -s artifacts/day001-native-origin-lens-android/layer-3-reduced.png
          test -s artifacts/day001-native-origin-lens-android/layer-3-reduced.xml
          test -s artifacts/day001-native-origin-lens-android/proof.txt
          test -s artifacts/day001-native-origin-lens-android/SHA256SUMS
          grep -q 'visual_approval=REQUIRES_HUMAN_SCREENSHOT_REVIEW' artifacts/day001-native-origin-lens-android/proof.txt
          grep -q 'persistent_user_data=NONE' artifacts/day001-native-origin-lens-android/proof.txt
          grep -q 'ritual_audio=NONE' artifacts/day001-native-origin-lens-android/proof.txt

      - name: Upload Native Origin Lens Android proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hnk-day001-native-origin-lens-android-v1
          path: artifacts/day001-native-origin-lens-android
          retention-days: 30
          if-no-files-found: error
